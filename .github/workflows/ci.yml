name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04 # ships git, jq, shellcheck and node
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck -x scripts/rflow tests/rflow.bats
      - name: tests
        run: npx --yes bats@1.13.0 tests/
      - name: validate plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.300 plugin validate . --strict
